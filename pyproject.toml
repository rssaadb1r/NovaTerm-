[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaterm"
version = "0.1.0"
description = "Cross-platform SSH/Telnet terminal client (SecureCRT-inspired) for Linux."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NovaTerm Contributors" }]
dependencies = [
    "PyQt6>=6.6",
    "qasync>=0.27",
    "paramiko>=3.4",
    "telnetlib3>=2.0.4",
    "cryptography>=42.0",
    "bcrypt>=4.1",
    "SQLAlchemy>=2.0",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "pyte>=0.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
novaterm = "main:main"

[tool.setuptools]
packages = ["core", "ui"]
py-modules = ["main"]

[tool.setuptools.package-data]
"*" = ["themes/*.toml", "assets/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyqt6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
